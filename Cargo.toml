[package]
name = "course-share"
version = "0.1.0"
edition = "2021"
description = "PKU teaching-network replay browser and sharing plaza"
license = "MIT"

[features]
default = []
devtools = ["dep:gpui-devtools", "gpui-kit/inspector"]

[dependencies]
gpui-devtools = { version = "=0.5.1", optional = true }
gpui-kit = "=0.7.3"
gpui-component = "=0.7.3"
self_update = { version = "=1.3.3", default-features = false, features = ["github", "reqwest", "native-tls", "archive-tar", "compression-tar-gz", "archive-zip", "compression-zip-deflate"] }
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
md-5 = "0.10"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "brotli", "deflate", "gzip", "json", "native-tls"] }
rsa = { version = "0.9", features = ["pem", "sha2"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
url = "2"

[build-dependencies]
sha2 = "0.10"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = "symbols"
incremental = false
